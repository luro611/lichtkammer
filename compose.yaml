# Lichtkammer im eigenen LXC: docker compose up -d --build
# TLS beendet der Reverse-Proxy davor; LK_TRUST_PROXY=1 lässt X-Forwarded-Proto gelten und braucht
# LK_TRUSTED_PROXIES (Adresse des Proxys), sonst startet der Admin nicht.
services:
  lichtkammer:
    # Veröffentlichtes Image (Version anpassen; Update: docker compose pull && docker compose up -d)
    image: ghcr.io/luro611/lichtkammer:latest
    # Entwickler bauen lokal: die Zeile "image" auskommentieren und stattdessen "build: ." verwenden.
    #build: .
    restart: unless-stopped
    # Härtung (Entwurf 20, 4.2; auf pve10 noch zu prüfen, Schritt 8c): keine neuen Rechte, nur die Fähigkeiten, die Apache
    # braucht, Speichergrenze (Bildverarbeitung), Protokolle mit Obergrenze.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Noch zu testen (8c): schreibgeschütztes Wurzeldateisystem. Wenn es ohne Umbau läuft, die drei Zeilen einschalten.
    #read_only: true
    #tmpfs:
    #  - /tmp
    #  - /run/apache2
    # Nur lokal erreichbar (Proxy auf demselben Host). Läuft der Proxy im selben Docker-Netz, die Zeilen
    # "ports" ganz weglassen. Nie auf allen Schnittstellen veröffentlichen: sonst kann jeder im Netz
    # X-Forwarded-For/-Proto fälschen. OFFEN: Lutz bestätigt die Form nach dem Test auf pve10.
    ports:
      - "127.0.0.1:8080:80"
    env_file:
      - .env
    volumes:
      - lk-data:/var/lib/lichtkammer/data
      - lk-originals:/var/lib/lichtkammer/originals
      - lk-media:/var/www/html/public/media
volumes:
  lk-data:
  lk-originals:
  lk-media:
