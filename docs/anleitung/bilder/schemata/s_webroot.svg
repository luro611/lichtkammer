<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img"><rect width="900" height="400" fill="#fbf8f4"/><text x="450" y="36" font-family="'Instrument Serif', serif" font-size="26" fill="#242321" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">So sieht der Webroot nach dem Hochladen aus</text><text x="40" y="90" font-family="'Geist Mono', monospace" font-size="15.5" fill="#242321" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Webroot  (z. B. fotos.example.org/)</text><line x1="48" y1="101" x2="48" y2="112" stroke="#d9d3ca" stroke-width="1.2"/><line x1="48" y1="112" x2="62" y2="112" stroke="#d9d3ca" stroke-width="1.2"/><text x="64" y="116" font-family="'Geist Mono', monospace" font-size="15.5" fill="#242321" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">index.php</text><line x1="48" y1="127" x2="48" y2="138" stroke="#d9d3ca" stroke-width="1.2"/><line x1="48" y1="138" x2="62" y2="138" stroke="#d9d3ca" stroke-width="1.2"/><text x="64" y="142" font-family="'Geist Mono', monospace" font-size="15.5" fill="#242321" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">admin/ , assets/ , media/ ...</text><text x="337.9" y="142" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">aus dem Ordner public</text><line x1="48" y1="153" x2="48" y2="164" stroke="#d9d3ca" stroke-width="1.2"/><line x1="48" y1="164" x2="62" y2="164" stroke="#d9d3ca" stroke-width="1.2"/><text x="64" y="168" font-family="'Geist Mono', monospace" font-size="15.5" fill="#c75d3b" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">app/</text><text x="110.4" y="168" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">aus dem Ordner app, per .htaccess gesperrt</text><line x1="72" y1="179" x2="72" y2="190" stroke="#d9d3ca" stroke-width="1.2"/><line x1="72" y1="190" x2="86" y2="190" stroke="#d9d3ca" stroke-width="1.2"/><text x="88" y="194" font-family="'Geist Mono', monospace" font-size="15.5" fill="#242321" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">src/ , templates/ , migrations/</text><line x1="72" y1="205" x2="72" y2="216" stroke="#d9d3ca" stroke-width="1.2"/><line x1="72" y1="216" x2="86" y2="216" stroke="#d9d3ca" stroke-width="1.2"/><text x="88" y="220" font-family="'Geist Mono', monospace" font-size="15.5" fill="#c75d3b" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">.env</text><text x="134.4" y="220" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Ihre Einstellungen (neu angelegt)</text><text x="40" y="246" font-family="'Geist Mono', monospace" font-size="15.5" fill="#242321" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">lichtkammer-data/</text><text x="204.7" y="246" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Datenbank (Pflicht, neben dem Webroot, nicht darin)</text><text x="40" y="272" font-family="'Geist Mono', monospace" font-size="15.5" fill="#242321" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">lichtkammer-originals/</text><text x="250.2" y="272" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Originalfotos (Pflicht, neben dem Webroot)</text><rect x="40" y="320" width="820" height="56" rx="4" fill="#eee8df" stroke="#c75d3b" stroke-width="1.2"/><text x="60" y="345" font-family="Inter, sans-serif" font-size="14.5" fill="#242321" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">Wichtig: Die Datei heißt app/.env (im Ordner app), nicht .env im Webroot.</text><text x="60" y="366" font-family="Inter, sans-serif" font-size="13" fill="#77736c" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Der Admin lehnt eine .env im Webroot ab.</text></svg>