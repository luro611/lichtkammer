<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img"><rect width="900" height="260" fill="#fbf8f4"/><text x="450" y="34" font-family="'Instrument Serif', serif" font-size="26" fill="#242321" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">Umzug von WordPress</text><rect x="30" y="70" width="180" height="90" rx="4" fill="#fffdf9" stroke="#d9d3ca" stroke-width="1.2"/><text x="120.0" y="112.0" font-family="Inter, sans-serif" font-size="16" fill="#242321" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">Export</text><text x="120.0" y="132.0" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">Skript auf deinem Rechner</text><rect x="250" y="70" width="180" height="90" rx="4" fill="#fffdf9" stroke="#d9d3ca" stroke-width="1.2"/><text x="340.0" y="112.0" font-family="Inter, sans-serif" font-size="16" fill="#242321" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">Paket hochladen</text><text x="340.0" y="132.0" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">per FTPS in den Importordner</text><rect x="470" y="70" width="180" height="90" rx="4" fill="#eee8df" stroke="#c75d3b" stroke-width="1.2"/><text x="560.0" y="112.0" font-family="Inter, sans-serif" font-size="16" fill="#242321" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">Import im Admin</text><text x="560.0" y="132.0" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">Foto für Foto, fortsetzbar</text><rect x="690" y="70" width="180" height="90" rx="4" fill="#fffdf9" stroke="#d9d3ca" stroke-width="1.2"/><text x="780.0" y="112.0" font-family="Inter, sans-serif" font-size="16" fill="#242321" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">Durchsehen</text><text x="780.0" y="132.0" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">Alt-Texte, Fotografen, veröffentlichen</text><line x1="210" y1="115" x2="248" y2="115" stroke="#c75d3b" stroke-width="2"/><polygon points="248.0,115.0 239.0,119.3 239.0,110.7" fill="#c75d3b"/><line x1="430" y1="115" x2="468" y2="115" stroke="#c75d3b" stroke-width="2"/><polygon points="468.0,115.0 459.0,119.3 459.0,110.7" fill="#c75d3b"/><line x1="650" y1="115" x2="688" y2="115" stroke="#c75d3b" stroke-width="2"/><polygon points="688.0,115.0 679.0,119.3 679.0,110.7" fill="#c75d3b"/><text x="450" y="215" font-family="Inter, sans-serif" font-size="14.5" fill="#77736c" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">Alles landet zuerst als Entwurf. WordPress wird nur gelesen, nie verändert.</text></svg>