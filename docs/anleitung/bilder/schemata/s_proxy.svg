<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 295" role="img"><rect width="900" height="295" fill="#fbf8f4"/><text x="450" y="34" font-family="'Instrument Serif', serif" font-size="26" fill="#242321" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">Docker hinter einem Reverse-Proxy</text><rect x="30" y="90" width="170" height="80" rx="4" fill="#fffdf9" stroke="#d9d3ca" stroke-width="1.2"/><text x="115.0" y="127.0" font-family="Inter, sans-serif" font-size="16" fill="#242321" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">Browser</text><text x="115.0" y="147.0" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">https://fotos.example.org</text><rect x="280" y="90" width="190" height="80" rx="4" fill="#eee8df" stroke="#c75d3b" stroke-width="1.2"/><text x="375.0" y="127.0" font-family="Inter, sans-serif" font-size="16" fill="#242321" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">Reverse-Proxy</text><text x="375.0" y="147.0" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">beendet HTTPS (Zertifikat)</text><rect x="550" y="70" width="320" height="110" rx="4" fill="#eee8df" stroke="#c75d3b" stroke-width="1.2"/><text x="710.0" y="122.0" font-family="Inter, sans-serif" font-size="16" fill="#242321" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">Container lichtkammer</text><text x="710.0" y="142.0" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">Port 80 intern, nach außen nur 127.0.0.1:8080</text><line x1="200" y1="125" x2="278" y2="125" stroke="#c75d3b" stroke-width="2"/><polygon points="278.0,125.0 269.0,129.3 269.0,120.7" fill="#c75d3b"/><line x1="470" y1="125" x2="548" y2="125" stroke="#c75d3b" stroke-width="2"/><polygon points="548.0,125.0 539.0,129.3 539.0,120.7" fill="#c75d3b"/><text x="239" y="113" font-family="Inter, sans-serif" font-size="11.5" fill="#c75d3b" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">HTTPS</text><text x="509" y="113" font-family="Inter, sans-serif" font-size="11.5" fill="#c75d3b" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">HTTP</text><rect x="550" y="205" width="320" height="56" rx="4" fill="#eee8df" stroke="#d9d3ca" stroke-width="1.2"/><text x="710" y="228" font-family="Inter, sans-serif" font-size="14" fill="#242321" font-weight="600" text-anchor="middle" font-style="normal" letter-spacing="0">Volumes: Daten, Originale, Medien</text><text x="710" y="248" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">bleiben bei Updates erhalten</text><line x1="710" y1="180" x2="710" y2="205" stroke="#d9d3ca" stroke-width="1.2"/><text x="30" y="215" font-family="Inter, sans-serif" font-size="12.5" fill="#77736c" font-weight="600" text-anchor="start" font-style="normal" letter-spacing="0">In der .env:</text><text x="30" y="236" font-family="'Geist Mono', monospace" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">LK_BASE_URL=https://…</text><text x="30" y="256" font-family="'Geist Mono', monospace" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">LK_TRUST_PROXY=1</text><text x="30" y="276" font-family="'Geist Mono', monospace" font-size="12.5" fill="#77736c" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">LK_TRUSTED_PROXIES=&lt;Proxy-Adresse&gt;</text></svg>