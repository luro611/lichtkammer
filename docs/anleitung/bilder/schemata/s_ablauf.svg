<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img"><rect width="900" height="330" fill="#fbf8f4"/><text x="450" y="36" font-family="'Instrument Serif', serif" font-size="26" fill="#242321" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">Zwei Wege, ein Ergebnis</text><rect x="30" y="62" width="410" height="240" rx="4" fill="#fffdf9" stroke="#d9d3ca" stroke-width="1.2"/><rect x="460" y="62" width="410" height="240" rx="4" fill="#fffdf9" stroke="#d9d3ca" stroke-width="1.2"/><text x="50" y="92" font-family="Inter, sans-serif" font-size="17" fill="#c75d3b" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="0">Webspace (nur FTP)</text><text x="480" y="92" font-family="Inter, sans-serif" font-size="17" fill="#c75d3b" font-weight="700" text-anchor="start" font-style="normal" letter-spacing="0">Docker (eigener Server)</text><circle cx="58" cy="128" r="13" fill="#c75d3b"/><text x="58" y="133" font-family="Inter, sans-serif" font-size="14" fill="#fffdf9" font-weight="700" text-anchor="middle" font-style="normal" letter-spacing="0">1</text><text x="82" y="133" font-family="Inter, sans-serif" font-size="15" fill="#242321" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Zip herunterladen und prüfen</text><circle cx="58" cy="170" r="13" fill="#c75d3b"/><text x="58" y="175" font-family="Inter, sans-serif" font-size="14" fill="#fffdf9" font-weight="700" text-anchor="middle" font-style="normal" letter-spacing="0">2</text><text x="82" y="175" font-family="Inter, sans-serif" font-size="15" fill="#242321" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Mit dem FTP-Programm hochladen</text><circle cx="58" cy="212" r="13" fill="#c75d3b"/><text x="58" y="217" font-family="Inter, sans-serif" font-size="14" fill="#fffdf9" font-weight="700" text-anchor="middle" font-style="normal" letter-spacing="0">3</text><text x="82" y="217" font-family="Inter, sans-serif" fo