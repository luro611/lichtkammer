<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img"><rect width="900" height="330" fill="#fbf8f4"/><text x="450" y="34" font-family="'Instrument Serif', serif" font-size="26" fill="#242321" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">app/.env: das Mindeste</text><rect x="40" y="54" width="820" height="190" rx="4" fill="#242321" stroke="#242321" stroke-width="1.2"/><text x="62" y="92" font-family="'Geist Mono', monospace" font-size="14.5" fill="#f6f0e8" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">LK_BASE_URL=https://fotos.example.org</text><text x="62" y="120" font-family="'Geist Mono', monospace" font-size="14.5" fill="#f6f0e8" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">LK_SITE_NAME=Beispielfoto</text><text x="62" y="148" font-family="'Geist Mono', monospace" font-size="14.5" fill="#e47a55" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">LK_APP_KEY=&lt;44 Zeichen, von der Seite „Admin nicht verfügbar“&gt;</text><text x="62" y="176" font-family="'Geist Mono', monospace" font-size="14.5" fill="#e47a55" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">LK_SETUP_TOKEN=&lt;48 Zeichen, ebenso&gt;</text><text x="62" y="204" font-family="'Geist Mono', monospace" font-size="14.5" fill="#f6f0e8" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">LK_DATA_DIR=/www/htdocs/vXXXXXX/lichtkammer-data</text><text x="62" y="232" font-family="'Geist Mono', monospace" font-size="14.5" fill="#f6f0e8" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">LK_ORIGINALS_DIR=/www/htdocs/vXXXXXX/lichtkammer-originals</text><text x="40" y="274" font-family="Inter, sans-serif" font-size="13.5" fill="#77736c" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Orange: Geheimwerte. Den Schlüssel im Passwort-Manager sichern, getrennt von der Datensicherung.</text><text x="40" y="298" font-family="Inter, sans-serif" font-size="13.5" fill="#77736c" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">LK_DATA_DIR und LK_ORIGINALS_DIR sind Pflicht: zwei Ordner über dem Webroot (der Pfad kommt vom Anbieter).</text></svg>