<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img"><rect width="900" height="360" fill="#fbf8f4"/><text x="450" y="34" font-family="'Instrument Serif', serif" font-size="26" fill="#242321" font-weight="400" text-anchor="middle" font-style="normal" letter-spacing="0">Docker in drei Befehlen</text><rect x="40" y="54" width="820" height="240" rx="4" fill="#242321" stroke="#242321" stroke-width="1.2"/><text x="62" y="88" font-family="'Geist Mono', monospace" font-size="14.5" fill="#b8aea4" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0"># 1. Ordner anlegen, compose.yaml und .env hineinlegen</text><text x="62" y="112" font-family="'Geist Mono', monospace" font-size="14.5" fill="#f6f0e8" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">mkdir lichtkammer &amp;&amp; cd lichtkammer</text><text x="62" y="136" font-family="'Geist Mono', monospace" font-size="14.5" fill="#f6f0e8" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">openssl rand -base64 32   # für LK_APP_KEY</text><text x="62" y="160" font-family="'Geist Mono', monospace" font-size="14.5" fill="#f6f0e8" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">openssl rand -hex 24      # für LK_SETUP_TOKEN</text><text x="62" y="184" font-family="'Geist Mono', monospace" font-size="14.5" fill="#f6f0e8" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0"></text><text x="62" y="208" font-family="'Geist Mono', monospace" font-size="14.5" fill="#b8aea4" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0"># 2. Starten</text><text x="62" y="232" font-family="'Geist Mono', monospace" font-size="14.5" fill="#e47a55" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">docker compose up -d</text><text x="62" y="256" font-family="'Geist Mono', monospace" font-size="14.5" fill="#f6f0e8" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0"></text><text x="62" y="280" font-family="'Geist Mono', monospace" font-size="14.5" fill="#b8aea4" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0"># 3. Im Browser /admin/setup öffnen</text><text x="40" y="330" font-family="'Geist Mono', monospace" font-size="14.5" fill="#242321" font-weight="400" text-anchor="start" font-style="normal" letter-spacing="0">Update später: docker compose pull &amp;&amp; docker compose up -d</text></svg>