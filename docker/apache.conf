<VirtualHost *:80>
    DocumentRoot /var/www/html/public
    ServerSignature Off

    # Die Client-Adresse aus X-Forwarded-For wird nur für LK_TRUSTED_PROXIES übernommen: docker/entrypoint.sh
    # schreibt die Einstellung (conf-available/lk-remoteip.conf), solange die Variable leer ist, bleibt sie aus.

    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
